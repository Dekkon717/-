name: validate-skill

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate skill structure
        run: python scripts/quick_validate.py .
      - name: Validate corpus
        run: python scripts/validate_corpus.py --db data/national-ip-corpus/cases.db
